name: PULS

on:
  push:
    paths: ["puls/**", ".github/workflows/puls.yml"]
  pull_request:
    paths: ["puls/**", ".github/workflows/puls.yml"]

jobs:
  typescript-et-ia:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: puls/package-lock.json
      - run: npm ci
      # Vérification TypeScript (application et fonctions serveur), sortie compilée à jour, tests de la fonction IA.
      - run: npm run ci

  base-de-donnees:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Migrations rejouées sur une base jetable, puis tests d'isolation, de permissions et d'onboarding.
      - run: puls/db/test/run.sh
