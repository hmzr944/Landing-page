# Tests automatiques d'Arbor. Ce flux ne déploie rien : aucune publication, aucun secret, lecture seule du dépôt.
# La publication reste celle de GitHub Pages depuis main, inchangée.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serveur:
    name: Fonction tutor (Deno)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-net --allow-env --allow-read supabase/functions/tutor/

  base:
    name: Base de données (RLS, PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PostgreSQL 16 présent
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then sudo apt-get update && sudo apt-get install -y postgresql-16; fi
          /usr/lib/postgresql/16/bin/initdb --version
      - run: node tests/db-rls.js

  navigateur:
    name: Navigateur (${{ matrix.groupe }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - groupe: student
            suites: welcome onboarding student-path home-adaptive learning-flow foundations explore motion responsive fiche jeu-de-mesure
          - groupe: import
            suites: pdf-structure pdf-mixed data-safety engines corpus-metier benchmark
          - groupe: business
            suites: org org-setup org-learn org-engines org-docs org-onboarding org-shell org-desktop org-insight
          - groupe: serveur-simule
            suites: tutor ai-server league feedback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright 1.63.0 et Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Suites
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          # Statut honnête de chaque suite : un contrôle non exécuté n'est jamais compté comme réussi.
          #  - SKIPPED : ignoré volontairement, avec sa raison (documents privés, exécutés seulement en local) ;
          #  - NON VÉRIFIÉ : aurait dû s'exécuter mais n'a pas pu (réseau…) : la suite est PARTIELLE et la tâche échoue.
          echoue=""
          echo "| Suite | Statut | Non exécutés |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for s in $SUITES; do
            echo "::group::$s"
            if node "tests/$s.js" > "out-$s.txt" 2>&1; then rc=0; else rc=1; fi
            cat "out-$s.txt"
            echo "::endgroup::"
            sk=$(grep -c ': SKIPPED (' "out-$s.txt" || true)
            nv=$(grep -c 'NON VÉRIFIÉ' "out-$s.txt" || true)
            details=$(grep -E ': SKIPPED \(|NON VÉRIFIÉ' "out-$s.txt" | sed 's/^– //' | tr '\n' ' ' || true)
            if [ "$rc" != "0" ]; then statut="ÉCHEC"; echo "::error::$s a échoué"; echoue="$echoue $s"
            elif [ "$nv" != "0" ]; then statut="PARTIEL : $nv contrôle(s) non exécuté(s)"; echo "::error::$s : $nv contrôle(s) NON VÉRIFIÉ(S), donc non exécuté(s) : $details"; echoue="$echoue $s(partiel)"
            elif [ "$sk" != "0" ]; then statut="réussi pour ce qui a été exécuté ; $sk SKIPPED"; echo "::notice::$s : $sk contrôle(s) SKIPPED : $details"
            else statut="réussi"; fi
            echo "$s : $statut"
            echo "| $s | $statut | ${details:-aucun} |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -n "$echoue" ]; then echo "Suites en échec ou partielles :$echoue"; exit 1; fi
