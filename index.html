<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arbor · Apprendre en arborescence</title>
  <meta name="description" content="Découpe n'importe quel sujet en une arborescence de petites parties, prends des notes, importe un PDF et révise en t'amusant." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>" />
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <header class="topbar">
    <button class="brand" id="homeBtn" title="Accueil">
      <span class="brand-logo">🌳</span><span class="brand-name">Arbor</span>
    </button>
    <div class="topbar-actions">
      <div class="xp" id="xp" title="Points d'expérience gagnés en maîtrisant des parties">
        <span class="xp-level" id="xpLevel">Niv. 1</span>
        <span class="xp-bar"><span id="xpFill"></span></span>
        <span class="xp-num" id="xpNum">0 XP</span>
      </div>
      <button class="btn ghost" id="importPdfBtn"><span>📄</span><span class="hide-sm">Importer un PDF</span></button>
      <button class="icon-btn" id="themeBtn" title="Changer de thème">🌓</button>
      <button class="icon-btn" id="settingsBtn" title="Réglages">⚙️</button>
    </div>
  </header>

  <main id="app"></main>

  <!-- Modale générique -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="icon-btn modal-close" id="modalClose" title="Fermer">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <input type="file" id="pdfInput" accept="application/pdf" hidden />
  <input type="file" id="jsonInput" accept="application/json" hidden />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/pdf-import.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
