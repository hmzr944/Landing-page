<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Arbor · Apprendre en arborescence</title>
  <meta name="description" content="Découpe n'importe quel sujet en petites parties, prends des notes, importe un PDF et révise avec des cartes." />
  <meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <!-- Polices Fontshare : Satoshi (titres) et Chillax (textes) -->
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=chillax@400,500,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Arbor" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><g style='mix-blend-mode:multiply'><path transform='rotate(-38 20 35)' fill='%23FF5C7A' d='M20 35 C12.6 27 12.6 13.5 20 5 C27.4 13.5 27.4 27 20 35 Z'/><path transform='rotate(38 20 35)' fill='%23FFB020' d='M20 35 C12.6 27 12.6 13.5 20 5 C27.4 13.5 27.4 27 20 35 Z'/><path fill='%233451D1' fill-opacity='.9' d='M20 35 C12.6 27 12.6 13.5 20 5 C27.4 13.5 27.4 27 20 35 Z'/></g><circle cx='20' cy='35' r='3.4' fill='%2315171C'/></svg>" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-par">
      <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
    </div>
  </div>
  <a class="skip" href="#app">Aller au contenu</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Arbor, accueil">
      <svg class="logo" viewBox="0 0 40 40" role="img" aria-hidden="true">
        <g class="logo-leaves">
          <path class="lf lf-l" d="M20 35 C12.6 27 12.6 13.5 20 5 C27.4 13.5 27.4 27 20 35 Z"/>
          <path class="lf lf-r" d="M20 35 C12.6 27 12.6 13.5 20 5 C27.4 13.5 27.4 27 20 35 Z"/>
          <path class="lf lf-c" d="M20 35 C12.6 27 12.6 13.5 20 5 C27.4 13.5 27.4 27 20 35 Z"/>
        </g>
        <circle class="logo-seed" cx="20" cy="35" r="3.4"/>
      </svg>
      <span class="brand-name" translate="no">Arbor</span>
    </a>
    <div class="topbar-actions">
      <div class="xp" id="xp" title="Points gagnés en maîtrisant des parties">
        <i class="ph-fill ph-lightning" aria-hidden="true"></i>
        <span class="xp-level" id="xpLevel">Niv. 1</span>
        <span class="xp-bar" aria-hidden="true"><span id="xpFill"></span></span>
        <span class="xp-num" id="xpNum">0 XP</span>
      </div>
      <a class="btn ghost hide-mobile" href="#/reviser" data-nav="study"><i class="ph ph-cards" aria-hidden="true"></i><span>Réviser</span><b class="badge due-count" hidden></b></a>
      <button class="icon-btn hide-mobile" data-act="focus-open" aria-label="Mode Focus"><i class="ph ph-timer" aria-hidden="true"></i></button>
      <button class="btn ghost hide-mobile" id="importPdfBtn"><i class="ph ph-file-arrow-up" aria-hidden="true"></i><span class="hide-sm">Importer un PDF</span></button>
      <button class="icon-btn" id="themeBtn" aria-label="Changer de thème"><i class="ph ph-moon" aria-hidden="true"></i></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Réglages"><i class="ph ph-gear" aria-hidden="true"></i></button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="icon-btn modal-close" id="modalClose" aria-label="Fermer"><i class="ph ph-x" aria-hidden="true"></i></button>
      <div id="modalBody"></div>
    </div>
  </div>

  <button class="focus-pill" id="focusPill" type="button" hidden aria-label="Ouvrir le minuteur Focus">
    <i class="ph-fill ph-timer" aria-hidden="true"></i><span class="fp-label">Focus</span><b class="fp-time num">25:00</b>
  </button>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <a href="#/" data-nav="home"><i class="ph ph-house" aria-hidden="true"></i><span>Accueil</span></a>
    <a href="#/reviser" data-nav="study"><i class="ph ph-cards" aria-hidden="true"></i><span>Réviser</span><b class="nav-badge due-count" hidden></b></a>
    <button type="button" data-act="focus-open" data-nav="focus"><i class="ph ph-timer" aria-hidden="true"></i><span class="focus-nav-label">Focus</span></button>
    <a href="#/methode" data-nav="method"><i class="ph ph-lightbulb" aria-hidden="true"></i><span>Méthode</span></a>
  </nav>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <input type="file" id="pdfInput" accept="application/pdf" hidden />
  <input type="file" id="jsonInput" accept="application/json" hidden />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/store.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/pdf-import.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/mascot.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
